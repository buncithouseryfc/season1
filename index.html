<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHFC — Season 1 Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f6;
    --surface:#ffffff;
    --ink:#1c1e1b;
    --ink-soft:#6b7069;
    --ink-faint:#a3a89f;
    --line:#eceae3;
    --accent:#2f7a52;
    --accent-soft:#e7f2ec;
    --accent-deep:#1f5c3c;
    --pos:#2f7a52;
    --neg:#c1443d;
    --neg-soft:#fbebea;
    --radius:16px;
    --shadow:0 1px 2px rgba(20,20,15,0.04), 0 8px 24px rgba(20,20,15,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .page{
    max-width:720px;
    margin:0 auto;
    padding:48px 20px 80px;
  }

  header{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:8px;
  }
  .logo-badge{
    width:52px; height:52px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow:var(--shadow);
  }
  .logo-badge img{
    width:30px; height:auto;
    display:block;
  }
  .brand-text h1{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--ink);
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
  }

  .intro{
    margin:28px 0 24px;
  }
  .intro h2{
    font-size:28px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  .intro p{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0;
    max-width:52ch;
  }

  .search-box{
    position:relative;
    margin-bottom:20px;
  }
  .search-box svg{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; stroke:var(--ink-faint);
  }
  .search-box input{
    width:100%;
    padding:13px 16px 13px 44px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--surface);
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
    box-shadow:var(--shadow);
  }
  .search-box input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .search-box input::placeholder{color:var(--ink-faint);}

  .stats-strip{
    display:flex;
    gap:8px;
    margin-bottom:24px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .stats-strip span b{color:var(--ink); font-weight:700;}

  .board{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background .12s;
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:#fbfaf7;}
  .row.open{background:var(--accent-soft);}

  .rank{
    width:26px;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-faint);
    flex-shrink:0;
  }
  .row.top1 .rank{color:#c9962e;}
  .row.top2 .rank{color:#9aa0a8;}
  .row.top3 .rank{color:#b0703f;}

  .avatar{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent-deep);
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:700;
    flex-shrink:0;
  }

  .rname{
    flex:1;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .rgames{
    font-size:11.5px;
    color:var(--ink-faint);
    font-family:'JetBrains Mono',monospace;
    flex-shrink:0;
    display:none;
  }
  @media (min-width:480px){ .rgames{ display:block; } }

  .rpts{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    min-width:38px;
    text-align:right;
    flex-shrink:0;
  }
  .chevron{
    width:14px; height:14px;
    flex-shrink:0;
    transition:transform .15s;
    stroke:var(--ink-faint);
  }
  .row.open .chevron{ transform:rotate(90deg); }

  .detail{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
    background:#fdfcfa;
    border-bottom:1px solid var(--line);
  }
  .detail:last-child{border-bottom:none;}
  .detail-inner{
    padding:6px 18px 20px 58px;
  }

  .section-lbl{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:14px 0 8px;
  }

  .games{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .game-pill{
    padding:6px 9px;
    border-radius:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-faint);
  }
  .game-pill.went{
    background:var(--accent-soft);
    border-color:transparent;
    color:var(--accent-deep);
  }

  .summary-line{
    display:flex;
    align-items:center;
    padding:8px 0;
    font-size:14px;
    border-bottom:1px solid var(--line);
  }
  .summary-line:last-child{border-bottom:none;}
  .summary-line .sname{flex:1; color:var(--ink); font-weight:500;}
  .summary-line .spts{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:14.5px;
    min-width:44px;
    text-align:right;
  }
  .spts.pos{color:var(--pos);}
  .spts.neg{color:var(--neg);}
  .spts.zero{color:var(--ink-faint);}

  .sum-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:12px;
    margin-top:8px;
    border-top:1px dashed var(--line);
    font-size:13px;
    color:var(--ink-soft);
  }
  .sum-line b{
    font-family:'JetBrains Mono',monospace;
    color:var(--ink);
    font-size:15px;
  }

  .empty-state{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-faint);
    font-size:14px;
  }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:12px;
    color:var(--ink-faint);
  }
</style>
</head>

"game":"G3","attended":true,"points":3.0},{"game":"G4","attended":false,"points":0.0},{"game":"G5","attended":false,"points":0.0},{"game":"G6","attended":false,"points":0,"pending":true},{"game":"G7","attended":false,"points":0,"pending":true},{"game":"G8","attended":false,"points":0,"pending":true}],"attendPointsTotal":3.0,"goalsCount":0.0,"goalsPoints":0.0,"assistsCount":0.0,"assistsPoints":0.0,"bonusPoints":0.0,"totalSheet":3.0}]};
const TOTAL_GAMES = DATA.totalSeasonGames;

const players = DATA.players
  .filter(p => p.totalSheet !== 0)
  .sort((a,b)=> b.totalSheet - a.totalSheet || a.name.localeCompare(b.name));

const board = document.getElementById('board');
const searchInput = document.getElementById('searchInput');
const statCount = document.getElementById('statCount');

let openName = null;

function initials(name){
  const parts = name.trim().split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

function fmt(n){
  const r = Math.round(n*10)/10;
  const sign = r > 0 ? '+' : '';
  return sign + (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1));
}

function cls(n){
  return n > 0 ? 'pos' : n < 0 ? 'neg' : 'zero';
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function detailHtml(p){
  const gamesRow = p.attendance.map(a =>
    '<span class="game-pill ' + (a.attended ? 'went' : '') + '">' + a.game + (a.attended ? ' ✓' : '') + '</span>'
  ).join('');

  const goalsLabel = 'Goals' + (p.goalsCount ? ' (' + Math.round(p.goalsCount) + ')' : '');
  const assistsLabel = 'Assists' + (p.assistsCount ? ' (' + Math.round(p.assistsCount) + ')' : '');

  return '<div class="detail-inner">' +
    '<div class="section-lbl">Attendance — ' + p.gamesAttended + ' of ' + TOTAL_GAMES + ' games</div>' +
    '<div class="games">' + gamesRow + '</div>' +
    '<div class="section-lbl">Scoring &amp; Bonuses</div>' +
    '<div class="summary-line"><span class="sname">Attendance</span><span class="spts ' + cls(p.attendPointsTotal) + '">' + fmt(p.attendPointsTotal) + '</span></div>' +
    '<div class="summary-line"><span class="sname">' + goalsLabel + '</span><span class="spts ' + cls(p.goalsPoints) + '">' + fmt(p.goalsPoints) + '</span></div>' +
    '<div class="summary-line"><span class="sname">' + assistsLabel + '</span><span class="spts ' + cls(p.assistsPoints) + '">' + fmt(p.assistsPoints) + '</span></div>' +
    '<div class="summary-line"><span class="sname">Bonuses</span><span class="spts ' + cls(p.bonusPoints) + '">' + fmt(p.bonusPoints) + '</span></div>' +
    '<div class="sum-line"><span>Total</span><b>' + fmt(p.totalSheet) + ' pts</b></div>' +
    '</div>';
}

function render(filter){
  const f = filter.trim().toLowerCase();
  const filtered = f ? players.filter(p => p.name.toLowerCase().includes(f)) : players;

  statCount.innerHTML = '<b>' + filtered.length + '</b> ' + (f ? 'match' + (filtered.length===1?'':'es') : 'players on the board');

  if(filtered.length === 0){
    board.innerHTML = '<div class="empty-state">No player found for "' + escapeHtml(filter) + '"</div>';
    return;
  }

  board.innerHTML = filtered.map(p => {
    const rank = players.indexOf(p) + 1;
    const isOpen = p.name === openName;
    const topClass = rank === 1 ? ' top1' : rank === 2 ? ' top2' : rank === 3 ? ' top3' : '';
    return (
      '<div class="row' + (isOpen ? ' open' : '') + topClass + '" data-name="' + escapeHtml(p.name) + '">' +
        '<span class="rank">' + rank + '</span>' +
        '<span class="avatar">' + initials(p.name) + '</span>' +
        '<span class="rname">' + escapeHtml(p.name) + '</span>' +
        '<span class="rgames">' + p.gamesAttended + '/' + TOTAL_GAMES + ' games</span>' +
        '<span class="rpts">' + Math.round(p.totalSheet) + '</span>' +
        '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>' +
      '</div>' +
      '<div class="detail" data-detail="' + escapeHtml(p.name) + '" style="max-height:' + (isOpen ? '600px' : '0') + '">' +
        detailHtml(p) +
      '</div>'
    );
  }).join('');

  board.querySelectorAll('.row').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.getAttribute('data-name');
      openName = (openName === name) ? null : name;
      render(searchInput.value);
      if(openName){
        const detailEl = board.querySelector('[data-detail="' + CSS.escape(openName) + '"]');
        if(detailEl){
          setTimeout(() => detailEl.scrollIntoView({behavior:'smooth', block:'nearest'}), 80);
        }
      }
    });
  });
}

searchInput.addEventListener('input', () => render(searchInput.value));

render('');
</script>
